name: Build

# Every push builds the three ROMs as workflow artifacts; a v* tag also publishes them as a release.
on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm
    permissions:
      contents: write
    env:
      NAME: ${{ github.ref_type == 'tag' && github.ref_name || github.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          make
          make VARIANT=ezo
          make VARIANT=ezode
          mkdir out
          cp migoomba.gba "out/migoomba_${NAME}.gba"
          cp migoomba_ezo.gba "out/migoomba_${NAME}_ezo.gba"
          cp migoomba_ezode.gba "out/migoomba_${NAME}_ezode.gba"

      - uses: actions/upload-artifact@v4
        with:
          name: migoomba
          path: out/*.gba

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.gba
          generate_release_notes: true
